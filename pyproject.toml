[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "footcast"
version = "0.1.0"
description = "استخراج اخبار فوتبال ایران و جهان، تولید محتوای نوشتاری، بازبینی و تبدیل به فایل صوتی با ElevenLabs"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "vilanovax" }]
keywords = ["podcast", "football", "tts", "persian", "news", "elevenlabs"]

dependencies = [
    "feedparser>=6.0.11",
    "requests>=2.31.0",
    "PyYAML>=6.0.1",
    "pydantic>=2.6.0",
    "python-dotenv>=1.0.1",
    "anthropic>=0.40.0",
    "click>=8.1.7",
    "rich>=13.7.0",
    "imageio-ffmpeg>=0.4.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
footcast = "footcast.cli:main"

[tool.setuptools.packages.find]
include = ["footcast*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
