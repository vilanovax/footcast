# ---------------------------------------------------------------------------
# فرهنگ تلفظ — نام‌های خارجی و اصطلاحات فوتبالی
# ---------------------------------------------------------------------------
# هر ورودی:
#   original   : شکل اصلی (لاتین یا فارسیِ رایج) که در متن ظاهر می‌شود
#   display_fa : شکل نمایشی فارسی (برای شونوت/متن)
#   tts_fa     : شکلی که به TTS داده می‌شود تا درست تلفظ شود (با اعراب)
#   entity     : PLAYER | COACH | TEAM | STADIUM | CITY | TOURNAMENT | ORGANIZATION | TERM
#   language   : (اختیاری) زبان مبدأ نام: es | fr | en | de | it | ...
#   verified   : آیا تلفظ توسط انسان تأیید شده؟
#
# سه نسخه از هر نام:
#   تحریریه : display_fa (original)         → برای بررسی انسانی
#   TTS     : tts_fa                        → فقط فارسیِ قابل‌تلفظ، بدون انگلیسی
#   انتشار  : display_fa — original          → برای شونوت و شبکه‌های اجتماعی
# نکته: نام مهمِ «تأییدنشده» پیش از تولید صوت نهایی باید هشدار (یا بلاکر) بدهد.

