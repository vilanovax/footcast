# ---------------------------------------------------------------------------
# Footcast — منابع خبری و تنظیمات پایپلاین
# ---------------------------------------------------------------------------
# هر منبع یک فید RSS است. برای اضافه/حذف کردن منبع کافی است این فایل را ویرایش کنی.
#   name    : نام نمایشی منبع
#   url     : آدرس فید RSS
#   region  : iran | europe | world  (برای دسته‌بندی و امتیازدهی)
#   weight  : وزن اهمیت منبع (۱ تا ۱۰) — منابع معتبرتر وزن بالاتر
#   enabled : فعال/غیرفعال بودن منبع
#   tier    : (اختیاری) TIER_1_OFFICIAL | TIER_2_RELIABLE | TIER_3_JOURNALIST | TIER_4_AGGREGATOR
#   is_official: (اختیاری) true برای منابع رسمی (سایت باشگاه، فدراسیون، لیگ)
#
# نکته: فقط منابع رسمی (is_official) می‌توانند یک خبر را «رسمی» کنند.
# فیدهای رسمی باشگاه‌ها/فدراسیون را با is_official: true اضافه کن.

sources:
  # --- ایران ---
  - name: "ورزش سه"
    url: "https://www.varzesh3.com/rss/all"
    region: iran
    weight: 8
    enabled: true

  - name: "ایسنا - ورزشی"
    url: "https://www.isna.ir/rss/tp/33"
    region: iran
    weight: 7
    enabled: true

  - name: "خبرگزاری مهر - ورزشی"
    url: "https://www.mehrnews.com/rss/tp/9"
    region: iran
    weight: 7
    enabled: true

  - name: "تسنیم - ورزشی"
    url: "https://www.tasnimnews.com/fa/rss/feed/0/7/9/ورزشی"
    region: iran
    weight: 6
    enabled: true

  # --- اروپا / جهان ---
  - name: "BBC Sport - Football"
    url: "https://feeds.bbci.co.uk/sport/football/rss.xml"
    region: europe
    weight: 9
    enabled: true

  - name: "The Guardian - Football"
    url: "https://www.theguardian.com/football/rss"
    region: europe
    weight: 9
    enabled: true

  - name: "Sky Sports - Football"
    url: "https://www.skysports.com/rss/12040"
    region: europe
    weight: 8
    enabled: true

  - name: "ESPN - Soccer"
    url: "https://www.espn.com/espn/rss/soccer/news"
    region: world
    weight: 7
    enabled: true

# ---------------------------------------------------------------------------
# تنظیمات انتخاب اخبار مهم
# ---------------------------------------------------------------------------
selection:
  # حداکثر تعداد خبری که وارد مرحله تولید محتوا می‌شود
  max_items: 8
  # فقط اخبار جدیدتر از این تعداد ساعت در نظر گرفته می‌شوند
  max_age_hours: 36
  # کلمات کلیدی که اهمیت خبر را بالا می‌برند (امتیاز اضافه)
  boost_keywords:
    - "تیم ملی"
    - "پرسپولیس"
    - "استقلال"
    - "لیگ قهرمانان"
    - "Champions League"
    - "Real Madrid"
    - "Barcelona"
    - "Premier League"
    - "transfer"
    - "نقل و انتقالات"
    - "جام جهانی"
    - "World Cup"

# ---------------------------------------------------------------------------
# تنظیمات تولید محتوا
# ---------------------------------------------------------------------------
content:
  # زبان خروجی نهایی: fa (فارسی) یا en (انگلیسی)
  language: fa
  # سبک و لحن گزارش
  tone: "خبری، روان، مناسب پخش صوتی رادیویی"
  # مدل Claude برای تولید محتوا
  model: "claude-sonnet-5"
  # حدود طول هر بخش خبری (کلمه)
  words_per_item: 90
  # نام برنامه/پادکست که در ابتدای فایل صوتی خوانده می‌شود
  show_name: "فوت‌کست — مرور اخبار فوتبال"

  # --- هویت ثابت برنامه ---
  # شروع و پایان هر اپیزود جمله‌های ثابت دارند؛ فقط {date} و تیترهای روز تغییر می‌کنند.
  # {host} = نام مجری، {date} = روز هفته و تاریخ شمسی (مثل «دوشنبه، بیست‌ودوم تیر»).
  host_name: "ساشا"
  intro_signature: "سلام. من {host} هستم و امروز {date}، با تازه‌ترین و مهم‌ترین خبرهای فوتبال ایران و جهان همراه شما هستم."
  outro_signature: "من {host} هستم و اینجا فوتبال را دنبال می‌کنیم، نه هر چیزی را که لباس خبر پوشیده است. تا بسته بعدی، مراقب خودتان باشید."
  follow_invite: "اگر از این برنامه خوشتان آمد، دنبالش کنید تا بسته بعدی از دستتان نرود."

# ---------------------------------------------------------------------------
# تنظیمات صوت و مونتاژ
# ---------------------------------------------------------------------------
audio:
  sample_rate: 48000
  # اهداف Loudness (استاندارد پادکست)
  target_lufs: -16.0
  max_true_peak_db: -1.0
  # مسیر فایل‌های اینترو/اوترو (اختیاری). فایل را در assets/ بگذار.
  # می‌توان با متغیر محیطی INTRO_AUDIO_PATH هم تنظیم کرد.
  intro_path: ""
  outro_path: ""
